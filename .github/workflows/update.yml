name: Update cask

# Checks supmine/framemark for a newer release and bumps Casks/framemark.rb.
# Runs daily and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R supmine/framemark --json tagName -q .tagName)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/framemark.rb)
          if [ "$version" = "$current" ]; then echo "Already at $version"; exit 0; fi
          gh release download "$tag" -R supmine/framemark -p Framemark-macos-arm64.zip
          sha=$(sha256sum Framemark-macos-arm64.zip | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/framemark.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "framemark $version"
          git push
